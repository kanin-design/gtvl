name: gtvl
description: "GTVL: a clean, light home screen for Android TV."
publish_to: 'none'
version: 0.2.6+8

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # The only dependency: plays the aerial and video wallpapers.
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Icons only; release builds keep just the glyphs in use.
  uses-material-design: true
  # The dock's glow (lib/glow.dart).
  shaders:
    - shaders/glow.frag
  assets:
    - assets/aerials.json
    - assets/defaults.json
    - assets/apple_root_ca.pem
  # The UI's, a variable font whose weight axis FontWeight sets; the clock's
  # faces (ClockFace); the top bar's icons, of which release builds keep just
  # the glyphs in use. Licences beside them.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PoiretOne
      fonts:
        - asset: assets/fonts/PoiretOne-Regular.ttf
    - family: BigShouldersDisplay
      fonts:
        - asset: assets/fonts/BigShouldersDisplay.ttf
    - family: TulpenOne
      fonts:
        - asset: assets/fonts/TulpenOne-Regular.ttf
    - family: Teko
      fonts:
        - asset: assets/fonts/Teko.ttf
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto.ttf
    - family: SofiaSansExtraCondensed
      fonts:
        - asset: assets/fonts/SofiaSansExtraCondensed.ttf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost.ttf
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
